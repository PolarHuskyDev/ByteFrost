name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
            bin_dir: build/Release
            unit_tests_bin: build/Release/unit_tests
          - os: windows-latest
            name: Windows
            bin_dir: build/Release
            unit_tests_bin: build/Release/unit_tests.exe

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan>=2"

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Install system tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y lld

      - name: Prepare
        shell: bash
        run: ./perma.sh prepare

      - name: Build
        shell: bash
        run: ./perma.sh build

      - name: Run unit tests
        shell: bash
        run: ./${{ matrix.unit_tests_bin }}

      - name: Run E2E tests
        shell: bash
        run: bash scripts/test_compiled.sh
